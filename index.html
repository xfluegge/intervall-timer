<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101619"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Intervall"><title>Intervall – Trainingstimer</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#101619;--panel:#1b2428;--line:#354448;--text:#f4f8f6;--muted:#a9bab9;--green:#b7f76a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;place-items:center}main{width:min(100%,520px);display:grid;gap:15px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:20px;margin:0;letter-spacing:-.03em}.status{font-size:12px;color:var(--muted);text-align:right}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.timer{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px 12px 20px;text-align:center;transition:background .15s}.timer.flash{background:#405b23}.digits{font-size:clamp(72px,23vw,150px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.065em;line-height:1.13;color:var(--green);white-space:nowrap;margin:5px 0 12px;padding-right:.045em}.track{height:9px;background:#364248;border-radius:20px;overflow:hidden;margin:0 12px 16px}.bar{height:100%;width:100%;background:var(--green);border-radius:20px}.count{font-size:16px;color:var(--muted)}.count strong{color:var(--text);font-size:20px;font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px}button,input{font:inherit}button{border:1px solid var(--line);border-radius:14px;min-height:54px;font-weight:750;background:var(--panel);color:var(--text);cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}button.primary{background:var(--green);color:#15200d;border-color:transparent;font-size:20px}button:disabled{opacity:.42;cursor:default}.settings{border:1px solid var(--line);border-radius:18px;padding:15px;display:grid;gap:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label.field{display:grid;gap:5px;color:var(--muted);font-size:13px}input[type=number]{min-width:0;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px;font-size:23px;font-variant-numeric:tabular-nums;text-align:center}input:disabled{opacity:.5}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.presets button{min-height:40px;font-size:14px}.sound{display:flex;align-items:center;justify-content:space-between;gap:8px}.sound label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}.sound input{accent-color:var(--green);width:20px;height:20px}.sound button{min-height:40px;padding:0 12px;font-size:14px}.hint{font-size:12px;line-height:1.5;color:var(--muted);margin:0;text-align:center} @media(orientation:landscape) and (max-height:550px){main{width:min(100%,900px);grid-template-columns:1.35fr 1fr;gap:10px 18px}header{grid-column:1/-1}.timer{grid-column:1;grid-row:2}.digits{font-size:clamp(70px,19vh,120px)}.actions{grid-column:1;grid-row:3}.settings{grid-column:2;grid-row:2/4}.hint{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><h1>INTERVALL<span style="color:var(--green)">.</span></h1><span id="offline" class="status">Trainingstimer</span></header><section id="timer" class="timer"><div id="phase" class="eyebrow">Bereit</div><div id="digits" class="digits" role="timer" aria-label="Verbleibende Zeit">01:00</div><div class="track" aria-hidden="true"><div id="bar" class="bar"></div></div><div class="count">Abgeschlossene Intervalle: <strong id="count">0</strong></div></section><div class="actions"><button id="start" class="primary">Start</button><button id="reset">Reset</button></div><section class="settings" aria-label="Einstellungen"><div class="eyebrow">Intervall einstellen</div><div class="fields"><label class="field">Minuten<input id="minutes" type="number" min="0" max="99" step="1" inputmode="numeric" value="1"></label><label class="field">Sekunden<input id="seconds" type="number" min="0" max="59" step="1" inputmode="numeric" value="0"></label></div><div class="presets"><button data-sec="30">30 s</button><button data-sec="60">1 min</button><button data-sec="90">1:30</button><button data-sec="120">2 min</button></div><div class="sound"><label><input id="sound" type="checkbox" checked> Signalton</label><button id="test">Ton testen</button></div></section><p id="hint" class="hint">Der Timer wiederholt sich automatisch. Lass die App beim Training geöffnet.</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id), min=$('minutes'), sec=$('seconds'), sound=$('sound'), start=$('start'), presets=[...document.querySelectorAll('[data-sec]')];
let duration=60000, remaining=duration, end=0, completed=0, state='ready', ticker=null, audio=null, lock=null, lockPending=false, flashTimer=null;
const clamp=(v,max)=>Math.max(0,Math.min(max,Math.floor(Number(v)||0)));
function save(){try{localStorage.setItem('intervall-v1',JSON.stringify({seconds:duration/1000,sound:sound.checked}));}catch(e){}}
function setDuration(s){duration=Math.max(1000,Math.min(5999000,s*1000));remaining=duration;min.value=Math.floor(duration/60000);sec.value=duration/1000%60;save();render();}
function readInputs(){setDuration(clamp(min.value,99)*60+clamp(sec.value,59));}
function render(){const t=Math.max(0,Math.ceil(remaining/1000));$('digits').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');$('bar').style.width=(100*Math.max(0,Math.min(1,remaining/duration)))+'%';$('count').textContent=completed;$('phase').textContent=state==='running'?'Intervall '+(completed+1):state==='paused'?'Pause · Intervall '+(completed+1):'Bereit';start.textContent=state==='running'?'Pause':state==='paused'?'Weiter':'Start';min.disabled=sec.disabled=state!=='ready';presets.forEach(b=>b.disabled=state!=='ready');}
function unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!audio)audio=new AC();if(audio.state!=='running')audio.resume().catch(()=>{});return true;}catch(e){return false;}}
function beep(){if(!audio||audio.state!=='running')return false;try{const now=audio.currentTime;[0,.21,.42].forEach((offset,i)=>{const osc=audio.createOscillator(), gain=audio.createGain(), t=now+offset;osc.type='sine';osc.frequency.value=i===2?1250:950;gain.gain.setValueAtTime(.001,t);gain.gain.exponentialRampToValueAtTime(.7,t+.012);gain.gain.exponentialRampToValueAtTime(.001,t+.16);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.17);});return true;}catch(e){return false;}}
function tick(){if(state!=='running')return;const now=performance.now();if(now>=end){const n=1+Math.floor((now-end)/duration);completed+=n;end+=n*duration;if(sound.checked)beep();$('timer').classList.add('flash');clearTimeout(flashTimer);flashTimer=setTimeout(()=>$('timer').classList.remove('flash'),450);}remaining=end-now;render();}
function updateHint(msg){$('hint').textContent=msg;}
async function keepAwake(){if(!('wakeLock'in navigator)||state!=='running'||document.hidden||lockPending||(lock&&!lock.released)){return;}lockPending=true;try{const acquired=await navigator.wakeLock.request('screen');if(state!=='running'||document.hidden){await acquired.release();return;}lock=acquired;updateHint('Bildschirm bleibt nach Möglichkeit an. App geöffnet lassen.');acquired.addEventListener('release',()=>{if(lock===acquired){lock=null;if(state==='running')updateHint('Bildschirmsperre ggf. in den iPhone-Einstellungen deaktivieren.');}});}catch(e){if(state==='running')updateHint('Bildschirmsperre ggf. in den iPhone-Einstellungen deaktivieren.');}finally{lockPending=false;}}
function releaseAwake(){const old=lock;lock=null;if(old)old.release().catch(()=>{});}
function halt(){clearInterval(ticker);ticker=null;releaseAwake();}
start.addEventListener('click',()=>{if(state==='running'){tick();state='paused';halt();render();return;}unlockAudio();if(state==='ready')readInputs();state='running';end=performance.now()+remaining;render();ticker=setInterval(tick,50);if(!('wakeLock'in navigator))updateHint('Bildschirmsperre ggf. in den iPhone-Einstellungen deaktivieren.');keepAwake();});
$('reset').addEventListener('click',()=>{halt();state='ready';completed=0;remaining=duration;clearTimeout(flashTimer);$('timer').classList.remove('flash');updateHint('Der Timer wiederholt sich automatisch. Lass die App beim Training geöffnet.');render();});
[min,sec].forEach(el=>el.addEventListener('change',()=>{if(state==='ready')readInputs();}));presets.forEach(b=>b.addEventListener('click',()=>{if(state==='ready')setDuration(Number(b.dataset.sec));}));sound.addEventListener('change',()=>{if(sound.checked)unlockAudio();save();});$('test').addEventListener('click',async()=>{if(unlockAudio()){try{await audio.resume();}catch(e){}if(beep())return;}updateHint('Ton nicht verfügbar. Bitte Lautstärke und Stummschaltung prüfen.');});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state==='running'){tick();keepAwake();}});
try{const data=JSON.parse(localStorage.getItem('intervall-v1'));if(data&&Number.isFinite(data.seconds)&&data.seconds>=1){sound.checked=data.sound!==false;setDuration(data.seconds);}}catch(e){}render();
if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('offline').textContent='Offline bereit';}).catch(()=>{$('offline').textContent='Offline-Installation nicht verfügbar';});}else{$('offline').textContent='Lokale HTML-Version';}
</script></body></html>
