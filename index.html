<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101619"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Intervall"><title>Intervall – Trainingstimer</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#101619;--panel:#1b2428;--line:#354448;--text:#f4f8f6;--muted:#a9bab9;--green:#b7f76a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;place-items:center}main{width:min(100%,520px);display:grid;gap:15px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:20px;margin:0;letter-spacing:-.03em}.status{font-size:12px;color:var(--muted);text-align:right}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.timer{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px 12px 20px;text-align:center;transition:background .15s}.timer.flash{background:#405b23}.digits{font-size:clamp(72px,23vw,150px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.065em;line-height:1.13;color:var(--green);white-space:nowrap;margin:5px 0 12px;padding-right:.045em}.track{height:9px;background:#364248;border-radius:20px;overflow:hidden;margin:0 12px 16px}.bar{height:100%;width:100%;background:var(--green);border-radius:20px}.count{font-size:16px;color:var(--muted)}.count strong{color:var(--text);font-size:20px;font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px}button,input{font:inherit}button{border:1px solid var(--line);border-radius:14px;min-height:54px;font-weight:750;background:var(--panel);color:var(--text);cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}button.primary{background:var(--green);color:#15200d;border-color:transparent;font-size:20px}button:disabled{opacity:.42;cursor:default}.settings{border:1px solid var(--line);border-radius:18px;padding:15px;display:grid;gap:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label.field{display:grid;gap:5px;color:var(--muted);font-size:13px}input[type=number]{min-width:0;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px;font-size:23px;font-variant-numeric:tabular-nums;text-align:center}input:disabled{opacity:.5}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.presets button{min-height:40px;font-size:14px}.sound{display:flex;align-items:center;justify-content:space-between;gap:8px}.sound label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}.sound input{accent-color:var(--green);width:20px;height:20px}.sound button{min-height:40px;padding:0 12px;font-size:14px}.hint{font-size:12px;line-height:1.5;color:var(--muted);margin:0;text-align:center} @media(orientation:landscape) and (max-height:550px){main{width:min(100%,900px);grid-template-columns:1.35fr 1fr;gap:10px 18px}header{grid-column:1/-1}.timer{grid-column:1;grid-row:2}.digits{font-size:clamp(70px,19vh,120px)}.actions{grid-column:1;grid-row:3}.settings{grid-column:2;grid-row:2/4}.hint{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.timer.rest .digits{color:#8ed8ff}.timer.rest .bar{background:#8ed8ff}.timer.rest .eyebrow{color:#8ed8ff}.timer.rest.flash{background:#244759}.rest-settings{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}.rest-settings[hidden],.rest-fields[hidden]{display:none}.rest-settings .sound label{color:var(--text);font-weight:650}.rest-settings input[type=checkbox]{width:24px;height:24px}.rest-fields{display:grid;gap:8px}.version{white-space:nowrap}.next{font-size:13px;color:var(--muted);margin-top:7px;min-height:1em}.settings{gap:10px}.timer{padding-top:18px;padding-bottom:16px}@media(orientation:landscape) and (max-height:550px){body{place-items:start center}.settings{max-height:calc(100dvh - 65px);overflow-y:auto}.timer{align-self:start}.actions{align-self:start}}
</style></head><body><main><header><h1>INTERVALL<span style="color:var(--green)">.</span></h1><span id="offline" class="status">Version 3 · Trainingstimer</span></header><section id="timer" class="timer"><div id="phase" class="eyebrow">Bereit</div><div id="digits" class="digits" role="timer" aria-label="Verbleibende Zeit">01:00</div><div class="track" aria-hidden="true"><div id="bar" class="bar"></div></div><div class="count">Abgeschlossene Intervalle: <strong id="count">0</strong></div><div id="next" class="next"></div></section><div class="actions"><button id="start" class="primary">Start</button><button id="reset">Reset</button></div><section class="settings" aria-label="Einstellungen"><div class="eyebrow">Intervall einstellen</div><div class="fields"><label class="field">Minuten<input id="minutes" type="number" min="0" max="99" step="1" inputmode="numeric" value="1"></label><label class="field">Sekunden<input id="seconds" type="number" min="0" max="59" step="1" inputmode="numeric" value="0"></label></div><div class="presets"><button data-sec="30">30 s</button><button data-sec="60">1 min</button><button data-sec="90">1:30</button><button data-sec="120">2 min</button></div><div class="rest-settings"><div class="sound"><label><input id="restEnabled" type="checkbox"> Erholungspause aktivieren</label></div><div id="restFields" class="rest-fields" hidden><div class="fields"><label class="field">Pause · Minuten<input id="restMinutes" type="number" min="0" max="99" step="1" inputmode="numeric" value="0"></label><label class="field">Pause · Sekunden<input id="restSeconds" type="number" min="0" max="59" step="1" inputmode="numeric" value="30"></label></div></div></div><div class="sound"><label><input id="sound" type="checkbox" checked> Signalton</label><button id="test">Ton testen</button></div></section><p id="hint" class="hint">Ton zur Halbzeit; kurze Töne bei 3, 2, 1 Sekunden; langer Ton am Intervallende. App geöffnet lassen.</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id), min=$('minutes'), sec=$('seconds'), sound=$('sound'), start=$('start'), presets=[...document.querySelectorAll('[data-sec]')], restEnabled=$('restEnabled'), restMin=$('restMinutes'), restSec=$('restSeconds');
let duration=60000, restDuration=30000, remaining=duration, end=0, completed=0, state='ready', phase='work', ticker=null, audio=null, lock=null, lockPending=false, flashTimer=null, lastWarning=null, midpointPlayed=false;
const activeTones=new Set();
const baseHint='Ton zur Halbzeit; kurze Töne bei 3, 2, 1 Sekunden; langer Ton am Intervallende. App geöffnet lassen.';
const clamp=(v,max)=>Math.max(0,Math.min(max,Math.floor(Number(v)||0)));
const normalize=s=>Math.max(1000,Math.min(5999000,Math.floor(Number(s)||0)*1000));
const format=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');};
function save(){try{localStorage.setItem('intervall-v1',JSON.stringify({seconds:duration/1000,sound:sound.checked,restEnabled:restEnabled.checked,restSeconds:restDuration/1000}));}catch(e){}}
function setDuration(s){duration=normalize(s);remaining=duration;min.value=Math.floor(duration/60000);sec.value=duration/1000%60;save();render();}
function setRest(s){restDuration=normalize(s);restMin.value=Math.floor(restDuration/60000);restSec.value=restDuration/1000%60;save();render();}
function readInputs(){setDuration(clamp(min.value,99)*60+clamp(sec.value,59));setRest(clamp(restMin.value,99)*60+clamp(restSec.value,59));}
function render(){const rest=phase==='rest', total=rest?restDuration:duration; $('digits').textContent=format(remaining);$('bar').style.width=(100*Math.max(0,Math.min(1,remaining/total)))+'%';$('count').textContent=completed;$('timer').classList.toggle('rest',rest);const phaseName=rest?'Erholungspause':'Intervall '+(completed+1);$('phase').textContent=state==='ready'?'Bereit':state==='paused'?'Angehalten · '+phaseName:phaseName;$('next').textContent=rest?'Danach: Intervall '+(completed+1):restEnabled.checked?'Danach: '+format(restDuration)+' Erholungspause':'Automatische Wiederholung';start.textContent=state==='running'?'Anhalten':state==='paused'?'Weiter':'Start';min.disabled=sec.disabled=restEnabled.disabled=restMin.disabled=restSec.disabled=state!=='ready';presets.forEach(b=>b.disabled=state!=='ready');$('restFields').hidden=!restEnabled.checked;}
function unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!audio)audio=new AC();if(audio.state!=='running')audio.resume().catch(()=>{});return true;}catch(e){return false;}}
function tone(freq,length,delay=0){if(!audio||audio.state!=='running')return false;try{const t=audio.currentTime+delay, osc=audio.createOscillator(), gain=audio.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.001,t);gain.gain.exponentialRampToValueAtTime(.65,t+.012);gain.gain.exponentialRampToValueAtTime(.001,t+length-.01);osc.connect(gain);gain.connect(audio.destination);activeTones.add(osc);osc.onended=()=>{activeTones.delete(osc);osc.disconnect();gain.disconnect();};osc.start(t);osc.stop(t+length);return true;}catch(e){return false;}}
function stopTones(){for(const osc of activeTones){try{osc.stop();}catch(e){}}activeTones.clear();}
function flash(){ $('timer').classList.add('flash');clearTimeout(flashTimer);flashTimer=setTimeout(()=>$('timer').classList.remove('flash'),450);}
function warn(){if(phase!=='work')return false;const t=Math.ceil(remaining/1000);if(t>=1&&t<=3&&t!==lastWarning){lastWarning=t;return sound.checked&&tone(950,.12);}return false;}
function midpoint(warningNow=false){if(phase!=='work'||midpointPlayed||remaining>duration/2)return;midpointPlayed=true;
 // Do not replay an old halfway alert after a suspended/backgrounded timer.
 if(sound.checked&&duration/2-remaining<350)tone(550,.22,warningNow ? .16 : 0);
}
function tick(){if(state!=='running')return;const now=performance.now();let boundary=null, oldPhase=null;
 if(now>=end){
  // Skip whole cycles after a delayed tick without replaying old alerts.
  const cycle=duration+(restEnabled.checked?restDuration:0), cycles=Math.floor((now-end)/cycle);
  if(cycles>0){completed+=cycles;end+=cycles*cycle;}
  while(now>=end){boundary=end;oldPhase=phase;if(phase==='work'){completed++;phase=restEnabled.checked?'rest':'work';}else phase='work';end+=phase==='rest'?restDuration:duration;lastWarning=null;midpointPlayed=false;}
  if(now-boundary<350){if(sound.checked)tone(oldPhase==='work'?1250:700,.65);flash();}
 }
 remaining=end-now;
 // A one-to-three-second new interval may coincide with the previous end signal.
 // Do not play overlapping signals; defer the warning briefly within that second.
 if(boundary===null||now-boundary>=350){midpoint(warn());}else if(phase==='work'&&Math.ceil(remaining/1000)<=3){lastWarning=Math.ceil(remaining/1000);if(sound.checked)tone(950,.12,.70);}
 render();}
function updateHint(msg){$('hint').textContent=msg;}
async function keepAwake(){if(!('wakeLock'in navigator)||state!=='running'||document.hidden||lockPending||(lock&&!lock.released)){return;}lockPending=true;try{const acquired=await navigator.wakeLock.request('screen');if(state!=='running'||document.hidden){await acquired.release();return;}lock=acquired;updateHint(baseHint+' Bildschirm bleibt nach Möglichkeit an.');acquired.addEventListener('release',()=>{if(lock===acquired){lock=null;if(state==='running')updateHint(baseHint+' Bildschirmsperre ggf. deaktivieren.');}});}catch(e){if(state==='running')updateHint(baseHint+' Bildschirmsperre ggf. deaktivieren.');}finally{lockPending=false;}}
function releaseAwake(){const old=lock;lock=null;if(old)old.release().catch(()=>{});}
function halt(){clearInterval(ticker);ticker=null;releaseAwake();stopTones();clearTimeout(flashTimer);$('timer').classList.remove('flash');}
start.addEventListener('click',async()=>{if(state==='running'){tick();state='paused';halt();render();return;}if(state==='ready'){readInputs();lastWarning=null;midpointPlayed=false;}unlockAudio();state='running';end=performance.now()+remaining;render();ticker=setInterval(tick,40);keepAwake();if(audio&&audio.state!=='running'){try{await audio.resume();}catch(e){}}if(state==='running')warn();});
$('reset').addEventListener('click',()=>{halt();state='ready';phase='work';completed=0;remaining=duration;lastWarning=null;midpointPlayed=false;updateHint(baseHint);render();});
[min,sec,restMin,restSec].forEach(el=>el.addEventListener('change',()=>{if(state==='ready')readInputs();}));presets.forEach(b=>b.addEventListener('click',()=>{if(state==='ready')setDuration(Number(b.dataset.sec));}));restEnabled.addEventListener('change',()=>{if(state==='ready'){save();render();}});sound.addEventListener('change',()=>{if(sound.checked)unlockAudio();else stopTones();save();});$('test').addEventListener('click',async()=>{if(unlockAudio()){try{await audio.resume();}catch(e){}stopTones();if(tone(550,.22)){tone(950,.12,1);tone(950,.12,2);tone(950,.12,3);tone(1250,.65,4);return;}}updateHint('Ton nicht verfügbar. Bitte Lautstärke und Stummschaltung prüfen.');});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state==='running'){tick();keepAwake();}});
try{const data=JSON.parse(localStorage.getItem('intervall-v1'));if(data&&Number.isFinite(data.seconds)&&data.seconds>=1){sound.checked=data.sound!==false;restEnabled.checked=data.restEnabled===true;duration=normalize(data.seconds);remaining=duration;restDuration=normalize(Number.isFinite(data.restSeconds)?data.restSeconds:30);min.value=Math.floor(duration/60000);sec.value=duration/1000%60;restMin.value=Math.floor(restDuration/60000);restSec.value=restDuration/1000%60;}}catch(e){}render();
if('serviceWorker'in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{reg.update().catch(()=>{});return navigator.serviceWorker.ready;}).then(()=>{$('offline').textContent='Version 3 · Offline bereit';}).catch(()=>{$('offline').textContent='Version 3 · Offline nicht verfügbar';});}else{$('offline').textContent='Version 3 · Lokale HTML-Version';}
</script></body></html>
